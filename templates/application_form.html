<section class="card border-0 shadow-sm rounded-4 overflow-hidden mt-4">
    <form action="/jobs/{{ job.job_id }}/apply" method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div class="card-body p-4 p-md-5">
            <div class="d-flex align-items-center gap-3 pb-4 mb-4 border-bottom">
                <div class="d-inline-flex align-items-center justify-content-center rounded-circle flex-shrink-0" style="width: 48px; height: 48px; background: rgba(5, 31, 32, 0.06);">
                    <i class="bi bi-send-check text-dark fs-5" style="color: #051F20 !important;"></i>
                </div>
                <div>
                    <h4 class="fw-bold mb-1" style="color: #051F20;">Apply for this Position</h4>
                    <p class="text-muted small mb-0">Review and confirm your application details before submitting.</p>
                </div>
            </div>

            <div class="row g-3">
                <div class="col-md-6">
                    <label for="full_name" class="form-label fw-semibold small text-secondary">
                        <i class="bi bi-person me-1"></i> Full Name <span class="text-danger">*</span>
                    </label>
                    <input id="full_name" type="text" name="full_name" class="form-control" value="{{ user['name'] if user else '' }}" placeholder="Enter your full name" required>
                </div>

                <div class="col-md-6">
                    <label for="email" class="form-label fw-semibold small text-secondary">
                        <i class="bi bi-envelope me-1"></i> Email Address <span class="text-danger">*</span>
                    </label>
                    <input id="email" type="email" name="email" class="form-control" value="{{ user['email'] if user else '' }}" placeholder="you@example.com" required>
                </div>

                <div class="col-12">
                    <label for="linkedin_url" class="form-label fw-semibold small text-secondary">
                        <i class="bi bi-linkedin me-1"></i> LinkedIn Profile
                    </label>
                    <input id="linkedin_url" type="url" name="linkedin_url" class="form-control" value="{{ user['linkedin_url'] or '' if user else '' }}" placeholder="https://www.linkedin.com/in/your-name">
                </div>

                <div class="col-12">
                    <label for="education" class="form-label fw-semibold small text-secondary">
                        <i class="bi bi-mortarboard me-1"></i> Education <span class="text-danger">*</span>
                    </label>
                    <textarea id="education" name="education" class="form-control" rows="3" placeholder="Degree, institution, or relevant coursework" required>{{ user['education'] or '' if user else '' }}</textarea>
                </div>

                <div class="col-12">
                    <label for="work_experience" class="form-label fw-semibold small text-secondary">
                        <i class="bi bi-briefcase me-1"></i> Work Experience & Skills
                    </label>
                    <textarea id="work_experience" name="work_experience" class="form-control" rows="4" placeholder="Relevant internships, prior experience, or tech stacks used">{{ user['work_experience'] or '' if user else '' }}</textarea>
                </div>

                <div class="col-12">
                    <label for="resume_url" class="form-label fw-semibold small text-secondary">
                        <i class="bi bi-link-45deg me-1"></i> Portfolio or Résumé URL
                    </label>
                    <input id="resume_url" type="url" name="resume_url" class="form-control" value="{{ user['resume_url'] or '' if user else '' }}" placeholder="https://example.com/portfolio-or-resume">
                    <div class="form-text small">Provide a publicly viewable link to your PDF résumé, GitHub, or portfolio website.</div>
                </div>
            </div>
        </div>

        <div class="card-footer bg-light border-top p-4 d-flex flex-column flex-sm-row align-items-sm-center justify-content-between gap-3">
            <span class="text-muted small mb-0 d-flex align-items-center gap-1">
                <i class="bi bi-info-circle text-primary"></i> Profile fields are pre-filled for your convenience.
            </span>
            <button type="submit" class="btn btn-dark px-4 py-2 fw-semibold">
                <i class="bi bi-send-fill me-1 text-accent"></i> Submit Application
            </button>
        </div>
    </form>
</section>
