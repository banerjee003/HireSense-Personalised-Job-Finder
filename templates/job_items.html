<div class="job-card-v2">
    <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3">
        
        <!-- Left Side: Job Info -->
        <div class="text-start">
            <div class="job-title">{{ job.title }}</div>
            <div class="job-meta mb-0">
                {% if job.get('company') %}
                    <span>{{ job.company }}</span>
                {% endif %}
                <span>{{ job.location }}</span>
                {% if 'salary' in job and job.salary %}
                    <span>{{ job.currency }}{{ job.salary }}</span>
                {% endif %}
            </div>
        </div>

        <!-- Right Side: Apply Button -->
        <div class="text-md-end flex-shrink-0">
            <a href="/jobs/{{job['job_id']}}" class="btn btn-dark px-4 py-2 rounded-pill fw-bold shadow-sm">
                View & Apply <i class="bi bi-arrow-right ms-1"></i>
            </a>
        </div>
        
    </div>
</div>
